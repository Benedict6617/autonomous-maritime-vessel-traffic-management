version: "3.9"

services:
  vts-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./vts.db
      - APP_ENV=production
    volumes:
      - ./data:/app/data
    command: >
      sh -c "python scripts/seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
